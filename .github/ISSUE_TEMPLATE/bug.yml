name: Bug
description: A crash, a hook that misbehaves, a wrong count in /warden status, a config key that does not take effect.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Smallest sequence that reproduces it
      description: Prompt, tool call, and reply order if it matters. A session that reproduces it in a fresh `pi` with only pi-warden and pi-typesafe loaded is ideal.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`/warden status` output"
      description: Paste it whole; it names the mode, guards, thresholds, and config paths and contains no secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: "`~/.pi/agent/pi-warden/config.json` and `.pi/pi-warden.json` if present. Remove nothing but keys."
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      placeholder: "pi-warden 0.12.0, pi-typesafe 0.4.0, pi 0.85.1, macOS 15 / node 22"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Trace or error text
      description: "`/warden trace` lines or the error shown by Pi. Redact anything private."
      render: text
